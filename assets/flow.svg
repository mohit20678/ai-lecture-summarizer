<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="How it works: upload, read, notes, save, study">
  <rect width="1000" height="200" rx="16" fill="#0d1117"/>
  <line x1="105" y1="100" x2="865" y2="100" stroke="#7c83ff" stroke-width="3" stroke-dasharray="8 8" stroke-opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1s" repeatCount="indefinite"/>
  </line>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="62" width="150" height="76" rx="14" fill="#161b22" stroke="#7c83ff" stroke-width="1.5"><animate attributeName="stroke-width" values="1.5;4;1.5;1.5" keyTimes="0;0.1;0.25;1" dur="5s" begin="0s" repeatCount="indefinite"/></rect>
    <text x="105" y="96" font-size="16" font-weight="700" fill="#e6edf3">1. Upload</text><text x="105" y="118" font-size="12" fill="#8b949e">PDF or audio</text>
    <rect x="220" y="62" width="150" height="76" rx="14" fill="#161b22" stroke="#35d0ba" stroke-width="1.5"><animate attributeName="stroke-width" values="1.5;4;1.5;1.5" keyTimes="0;0.1;0.25;1" dur="5s" begin="1.25s" repeatCount="indefinite"/></rect>
    <text x="295" y="96" font-size="16" font-weight="700" fill="#e6edf3">2. Read</text><text x="295" y="118" font-size="12" fill="#8b949e">Text or transcript</text>
    <rect x="410" y="62" width="150" height="76" rx="14" fill="#161b22" stroke="#7c83ff" stroke-width="1.5"><animate attributeName="stroke-width" values="1.5;4;1.5;1.5" keyTimes="0;0.1;0.25;1" dur="5s" begin="2.5s" repeatCount="indefinite"/></rect>
    <text x="485" y="96" font-size="16" font-weight="700" fill="#e6edf3">3. Notes</text><text x="485" y="118" font-size="12" fill="#8b949e">Topics and visuals</text>
    <rect x="600" y="62" width="150" height="76" rx="14" fill="#161b22" stroke="#35d0ba" stroke-width="1.5"><animate attributeName="stroke-width" values="1.5;4;1.5;1.5" keyTimes="0;0.1;0.25;1" dur="5s" begin="3.75s" repeatCount="indefinite"/></rect>
    <text x="675" y="96" font-size="16" font-weight="700" fill="#e6edf3">4. Save</text><text x="675" y="118" font-size="12" fill="#8b949e">MongoDB Atlas</text>
    <rect x="790" y="62" width="150" height="76" rx="14" fill="#161b22" stroke="#ef6f91" stroke-width="1.5"><animate attributeName="stroke-width" values="1.5;4;1.5;1.5" keyTimes="0;0.1;0.25;1" dur="5s" begin="0s" repeatCount="indefinite"/></rect>
    <text x="865" y="96" font-size="16" font-weight="700" fill="#e6edf3">5. Study</text><text x="865" y="118" font-size="12" fill="#8b949e">Cards, quiz, chat</text>
  </g>
  <circle r="7" fill="#35d0ba">
    <animateMotion dur="5s" repeatCount="indefinite" path="M105,100 L865,100"/>
  </circle>
</svg>
